<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Klinik · Echavet</title><link rel="stylesheet" href="portal.css"><style>.bell{position:relative;border:1px solid var(--line);background:var(--surface);width:42px;border-radius:9px}.bell img{width:21px}.count{position:absolute;top:-7px;right:-7px;background:#d85151;color:white;border-radius:50%;font-size:10px;width:17px;height:17px}.camera{height:min(44vw,360px)}.formcard input,.formcard select,.formcard textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}.formcard textarea{min-height:70px}.chat{height:350px;display:flex;flex-direction:column}.msgs{flex:1}.msg{padding:10px;margin:8px 0;border-radius:11px;background:var(--surface2);font-size:12px;max-width:72%}.msg.me{margin-left:auto;background:#dcecf8}.compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}.compose input{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="echavet-supabase.js"></script></head><body><header class="topbar"><div class="logo"><img src="echavet-logo.png"><div>RSH Echavet<small>CLINICAL PORTAL</small></div></div><div class="top-actions"><button class="bell" onclick="consult()"><img src="notification-bell.png"><span class="count">3</span></button><button class="theme" onclick="document.body.classList.toggle('dark')">☾</button><button class="logout" onclick="location='login.html'">Keluar</button></div></header><div class="layout"><aside class="side"><div class="who"><b id="who"></b><small id="role"></small></div><nav class="nav"><button class="active" onclick="home(this)">⌂ &nbsp; Beranda</button><button onclick="monitor(this)">🎥 &nbsp; CCTV rawat inap</button><button onclick="data(this)">🐾 &nbsp; Monitoring anabul</button><button onclick="consult(this)">💬 &nbsp; Konsultasi</button><button onclick="schedule(this)">📅 &nbsp; Jadwal praktik</button><button onclick="codes(this)">🔑 &nbsp; Kode monitoring</button></nav></aside><main class="content" id="app"></main></div><div class="toast" id="toast"></div><script>const doctor=localStorage.getItem('echavetClinicRole')==='doctor',app=document.getElementById('app'),pets={1234:'Mochi',1357:'Bruno','0987':'Kiko','0864':'Luna'};who.textContent=doctor?'dr. Echa':'Rina · Staf rawat inap';role.textContent=doctor?'Dokter hewan':'Staf';function nav(b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active')}function h(a,b){return '<div class="heading"><h1>'+a+'</h1><p>'+b+'</p></div>'}function home(b){nav(b);app.innerHTML=h('Dashboard klinik',doctor?'3 konsultasi baru menunggu respons Anda.':'Monitoring, jadwal, dan data anabul untuk shift ini.')+'<div class="grid"><section class="card"><h2>Rawat inap hari ini</h2>'+Object.entries(pets).map(([c,p])=>'<div class="list-item"><div><b>'+p+'</b><small>Kode '+c+'</small></div><button class="primary" onclick="data()">Buka</button></div>').join('')+'</section><aside class="card"><h2>Akses cepat</h2><div class="quick"><button onclick="monitor()"><span>🎥</span><b>CCTV</b><small>Kamera ruang rawat</small></button><button onclick="data()"><span>📝</span><b>Input monitoring</b><small>Data pawrent</small></button><button onclick="schedule()"><span>📅</span><b>Jadwal shift</b><small>Dokter jaga</small></button><button onclick="consult()"><span>💬</span><b>Konsultasi</b><small>Pesan pawrent</small></button></div></aside></div>'}function monitor(b){nav(b);location="camera-rooms.html"}function data(b){nav(b);app.innerHTML=h('Monitoring anabul','Input ini menjadi sumber data yang tampil pada Portal Pawrent.')+'<section class="card formcard"><form onsubmit="save(event)"><div class="form"><div class="field"><label>Kode monitoring</label><select id="code">'+Object.entries(pets).map(x=>'<option value="'+x[0]+'">'+x[0]+' · '+x[1]+'</option>').join('')+'</select></div><div class="field"><label>Nama anabul</label><input id="name" value="Mochi"></div><div class="field"><label>Spesies</label><select id="species"><option>Kucing</option><option>Anjing</option><option>Ular</option><option>Landak</option></select></div><div class="field"><label>Ruang</label><input id="room" value="Mawar 02"></div><div class="field"><label>Suhu (C)</label><input id="temp" value="38.4"></div><div class="field"><label>Berat (kg)</label><input id="weight" value="4.2"></div><div class="field"><label>Makan</label><input id="food" value="Baik"></div><div class="field"><label>Minum</label><input id="water" value="Mau minum"></div><div class="field"><label>Pup</label><input id="stool" value="Padat / normal"></div><div class="field"><label>Muntah</label><input id="vomit" value="Tidak muntah"></div><div class="field"><label>Aktivitas</label><input id="activity" value="Aktif dan nyaman"></div><div class="field"><label>Obat / tindakan</label><input id="treatment"></div><div class="field wide"><label>Catatan pawrent</label><textarea id="notes"></textarea></div></div><button class="primary">Simpan monitoring</button></form></section>'}function save(e){e.preventDefault();let a=JSON.parse(localStorage.getItem('echavetMonitoring')||'{}');a[code.value]={name:name.value,species:species.value,breed:'',age:'',room:room.value,temp:temp.value,weight:weight.value,food:food.value,water:water.value,stool:stool.value,vomit:vomit.value,activity:activity.value,treatment:treatment.value,notes:notes.value,updated:new Date().toLocaleString('id-ID')};localStorage.setItem('echavetMonitoring',JSON.stringify(a));toast('Monitoring tersimpan dan diperbarui untuk pawrent.')}function schedule(b){nav(b);location='schedule-manager.html'}function codes(b){nav(b);location='room-manager.html'}function consult(b){nav(b);app.innerHTML=h('Konsultasi pawrent','3 pesan baru sesuai kode monitoring.')+'<section class="card">'+Object.entries(pets).map(([c,p])=>'<div class="list-item"><div><b>'+p+'</b><small>Kode '+c+' · Menunggu respons</small></div><button class="primary" onclick="openChat(\''+c+'\')">Balas</button></div>').join('')+'</section>'}function openChat(c){let a=JSON.parse(localStorage.getItem('echavetChats')||'{}'),m=a[c]||[];app.innerHTML=h('Chat '+pets[c],'Kode '+c)+'<section class="card"><div class="chat"><div class="msgs" id="msgs">'+m.map(x=>'<div class="msg '+(x.from==='doctor'?'me':'')+'">'+x.text+'</div>').join('')+'</div><form class="compose" onsubmit="reply(event,\''+c+'\')"><input id="replyText" placeholder="Tulis balasan dokter…"><button class="primary">Kirim</button></form></div></section>'}function reply(e,c){e.preventDefault();let a=JSON.parse(localStorage.getItem('echavetChats')||'{}');a[c]=a[c]||[];a[c].push({from:'doctor',doctor:'dr. Echa',text:replyText.value,time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('echavetChats',JSON.stringify(a));openChat(c)}function CCTVNotice(){toast("Izinkan akses kamera pada browser untuk memulai CCTV.")}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2500)}home();</script></body></html>
