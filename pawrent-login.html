  <style>

rgin-top:3px;color:var(--coral);font-size:10px;letter-spacing:1.5px;font-weight:700}.login h1{font:700 clamp(30px,3.2vw,42px)/1.1 Fraunces,serif;letter-spacing:-1.3px;color:var(--ink);margin:0 0 10px}.login>p{font-size:13px;line-height:1.55;color:var(--muted);margin:0 0 25px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px;color:var(--ink);outline-color:var(--leaf);font:inherit}.field textarea{min-height:76px;resize:vertical}.pass{position:relative}.pass input{padding-right:49px}.eye{position:absolute;right:5px;top:6px;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--leaf);font-size:18px;cursor:pointer}.error{font-size:11px;min-height:16px;margin-top:7px;color:#bd4f49}.ok{color:var(--leaf)}.primary{width:100%;border:0;border-radius:12px;margin-top:10px;padding:14px;background:var(--leaf);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 10px 22px #3670522b}.primary:hover{background:var(--leaf-dark)}.primary:disabled{opacity:.6;cursor:wait}.bottom-actions{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:19px}.toggle{border:0;background:transparent;padding:0;color:var(--leaf);font-size:12px;font-weight:700;cursor:pointer;text-align:left}.lang{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--muted);font-size:11px;cursor:pointer;white-space:nowrap}.mobile-brand{display:none}@media(max-width:860px){body{background:var(--cream)}.page{display:block;min-height:100vh}.visual{min-height:355px}.visual:before{width:310px;height:285px;right:-68px;top:-120px;border-radius:0 0 45% 45%}.brand-left{left:25px;top:24px}.copy{left:25px;right:25px;bottom:31px}.copy h1{font-size:43px;max-width:450px}.copy p{font-size:13px;margin-top:15px}.formside{padding:38px 25px 50px}.portal-mark{margin-bottom:28px}}@media(max-width:470px){.visual{min-height:314px}.copy h1{font-size:37px}.copy p{display:none}.brand-left{font-size:19px}.portal-mark img{width:47px;height:47px}.portal-mark b{font-size:20px}.bottom-actions{align-items:flex-start;flex-direction:column}.lang{order:-1}}
    /* Hilangkan panel dekoratif yang menutup foto hero. */

    .visual:before{display:none}

<body>
  <main class="page">
    <section class="visual" aria-label="Perawatan hewan EchaVet"><div class="brand-left"><i>♧</i>EchaVet</div><div class="copy"><div class="eyebrow">Portal khusus pawrent</div><h1 id="sloganTitle"></h1><p id="sloganText"></p></div></section>
    <section class="formside"><div class="login"><div class="portal-mark"><img src="echavet-logo.png" alt="Logo RSH Echavet"><div><b>RSH Echavet</b><small>PAWRENT PORTAL</small></div></div><h1 id="title"></h1><p id="desc"></p><form onsubmit="submitForm(event)"><div id="signupFields" hidden><div class="field"><label id="nameLabel"></label><input id="fullName" disabled></div><div class="field"><label id="phoneLabel"></label><input id="phone" type="tel" disabled></div><div class="field"><label id="addressLabel"></label><textarea id="address" disabled></textarea></div></div><div class="field"><label>Email</label><input id="email" type="email" required placeholder="nama@email.com" autocomplete="email"></div><div class="field"><label>Password</label><div class="pass"><input id="pass" type="password" required minlength="8" placeholder="••••••••" autocomplete="current-password"><button class="eye" type="button" onclick="togglePass()" aria-label="Tampilkan password">◉</button></div><div class="error" id="err"></div></div><button class="primary" id="submitBtn"></button></form><div class="bottom-actions"><button type="button" class="toggle" onclick="changeMode()" id="switchBtn"></button><button class="lang" onclick="toggleLang()" id="langBtn"></button></div></div></section>
  </main>
  <script>
    let signup=false,en=localStorage.getItem('echavetLang')==='en';
    const $=id=>document.getElementById(id),pass=$('pass'),err=$('err'),signupFields=$('signupFields'),fullName=$('fullName'),phone=$('phone'),address=$('address');
    const t={id:{sloganTitle:'Perawatan yang <em>hangat,</em> selalu dekat.',sloganText:'Pantau setiap perkembangan anabul kesayangan Anda dengan aman, jelas, dan tetap terhubung bersama tim medis RSH Echavet.',signinTitle:'Masuk ke akun Anda',signupTitle:'Buat akun pawrent',signinDesc:'Setelah masuk, gunakan kode monitoring yang diberikan staf.',signupDesc:'Lengkapi data Anda untuk membuat akun Pawrent.',name:'Nama lengkap Pawrent',phone:'Nomor telepon',address:'Alamat lengkap',namePH:'Nama sesuai identitas',phonePH:'Contoh: 0812 3456 7890',addressPH:'Alamat lengkap Pawrent',signin:'Masuk',signup:'Buat akun',new:'Belum punya akun? Buat akun',existing:'Sudah punya akun? Masuk',language:'English',password:'Gunakan minimal 8 karakter: huruf besar, kecil, angka, dan simbol.',bad:'Email atau password tidak sesuai.',clinical:'Akun staf/dokter harus masuk melalui Portal Klinik.'},en:{sloganTitle:'Exceptional care, <em>peace of mind</em> for you.',sloganText:'Follow every update on your beloved pet safely and clearly, while staying connected with the RSH Echavet medical team.',signinTitle:'Sign in to your account',signupTitle:'Create a pawrent account',signinDesc:'After signing in, enter the monitoring code provided by our staff.',signupDesc:'Complete your details to create your Pawrent account.',name:'Pawrent full name',phone:'Phone number',address:'Full address',namePH:'Name as shown on identification',phonePH:'Example: +62 812 3456 7890',addressPH:'Pawrent full address',signin:'Sign in',signup:'Create account',new:'New here? Create an account',existing:'Already have an account? Sign in',language:'Bahasa Indonesia',password:'Use at least 8 characters with uppercase, lowercase, a number, and a symbol.',bad:'Email or password is incorrect.',clinical:'Staff and doctor accounts must sign in through the Clinical Portal.'}};
    function text(){let x=t[en?'en':'id'];document.documentElement.lang=en?'en':'id';$('sloganTitle').innerHTML=x.sloganTitle;$('sloganText').textContent=x.sloganText;$('title').textContent=signup?x.signupTitle:x.signinTitle;$('desc').textContent=signup?x.signupDesc:x.signinDesc;$('nameLabel').textContent=x.name;$('phoneLabel').textContent=x.phone;$('addressLabel').textContent=x.address;fullName.placeholder=x.namePH;phone.placeholder=x.phonePH;address.placeholder=x.addressPH;$('submitBtn').textContent=signup?x.signup:x.signin;$('switchBtn').textContent=signup?x.existing:x.new;$('langBtn').textContent=x.language;pass.autocomplete=signup?'new-password':'current-password';signupFields.hidden=!signup;[fullName,phone,address].forEach(x=>{x.disabled=!signup;x.required=signup})}
    function changeMode(){signup=!signup;err.textContent='';text()}function toggleLang(){en=!en;localStorage.setItem('echavetLang',en?'en':'id');text()}function togglePass(){pass.type=pass.type==='password'?'text':'password'}function valid(p){return /[A-Z]/.test(p)&&/[a-z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p)&&p.length>=8}
    async function submitForm(e){e.preventDefault();let x=t[en?'en':'id'];err.className='error';if(!window.echavetDb){err.textContent='Supabase connection is unavailable.';return}let mail=$('email').value.trim().toLowerCase(),password=pass.value;if(signup&&!valid(password)){err.textContent=x.password;return}$('submitBtn').disabled=true;let r=signup?await echavetDb.auth.signUp({email:mail,password,options:{data:{full_name:fullName.value.trim(),phone:phone.value.trim(),address:address.value.trim()}}}):await echavetDb.auth.signInWithPassword({email:mail,password});$('submitBtn').disabled=false;if(r.error){err.textContent=r.error.message==='Invalid login credentials'?x.bad:r.error.message;return}let p=await echavetDb.from('profiles').select('role').eq('id',r.data.user.id).maybeSingle();if(p.data?.role&&p.data.role!=='pawrent'){await echavetDb.auth.signOut();err.textContent=x.clinical;return}location='pawrent-access.html'}
    text();
  </script>
<style>
  .brand-left{gap:10px;letter-spacing:-.6px}
  .brand-left img{width:45px;height:45px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}

</style><script>
  const officialBrand=document.querySelector('.brand-left');
  if(officialBrand) officialBrand.innerHTML='<img src="echavet-logo.png" alt="Logo RSH EchaVet"><span>RSH EchaVet<small>PAWRENT PORTAL</small></span>';

<style>
  .forgot-password{background:none;border:0;padding:0;color:#317858;font:700 13px 'DM Sans',sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .recovery-overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(21,42,32,.55)}.recovery-overlay[hidden]{display:none!important}
  .recovery-box{width:min(100%,470px);max-height:calc(100vh - 40px);overflow:auto;background:#fffdf9;border-radius:22px;padding:28px;box-shadow:0 22px 70px rgba(0,0,0,.24)}
  .recovery-head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:14px}.recovery-head h2{margin:0;color:#1d382b;font-size:25px}.recovery-head p{margin:7px 0 0;color:#63766c;line-height:1.5}.recovery-close{border:0;background:#edf3ec;color:#245d43;border-radius:10px;width:34px;height:34px;font-size:21px;cursor:pointer}
  .recovery-box .field{margin:16px 0}.recovery-box label{display:block;margin-bottom:7px;font-weight:700;color:#1d382b}.recovery-box input{box-sizing:border-box;width:100%;border:1px solid #d6e3d8;border-radius:12px;padding:14px;font-size:16px;color:#1d382b;background:#fff}.recovery-box input:focus{outline:2px solid #9ac8ac;border-color:#4d8a66}.recovery-help{font-size:13px;color:#64766c;line-height:1.5;margin:0 0 12px}.recovery-error{min-height:20px;color:#c43d3d;font-size:13px;margin-top:8px}.recovery-success{color:#21734a}.recovery-actions{display:flex;gap:10px;margin-top:20px}.recovery-actions button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer}.recovery-primary{background:#347a57;color:#fff}.recovery-secondary{background:#edf3ec;color:#245d43}.recovery-primary:disabled{opacity:.6;cursor:wait}
</style>
<script>
  (() => {
    const actions=document.querySelector('.bottom-actions');
    if(!actions) return;
    const forgot=document.createElement('button');
    forgot.type='button'; forgot.className='forgot-password'; forgot.textContent='Lupa password?';
    actions.prepend(forgot);
    let recoveryOverlay=null;
    const recoveryStrings={id:{forgot:'Lupa password?',title:'Atur ulang password',intro:'Masukkan email dan nomor WhatsApp yang terdaftar untuk menerima kode verifikasi.',otpIntro:'Masukkan kode 6 digit yang baru dikirim ke email Anda, lalu buat password baru.',email:'Alamat email',phone:'Nomor WhatsApp',phonePlaceholder:'Contoh: 0812 3456 7890',security:'Untuk keamanan, email dan nomor WhatsApp harus sesuai dengan akun Pawrent.',send:'Kirim kode email',cancel:'Batal',otp:'Kode verifikasi dari email',otpPlaceholder:'6 digit kode',newPassword:'Password baru',newPasswordPlaceholder:'Minimal 8 karakter',confirmPassword:'Ulangi password baru',confirmPasswordPlaceholder:'Ulangi password baru',passwordHelp:'Password harus berisi huruf besar, huruf kecil, angka, dan simbol.',save:'Simpan password baru',close:'Tutup',connection:'Koneksi akun belum tersedia. Coba muat ulang halaman.',accountMismatch:'Data akun tidak cocok. Periksa email dan nomor WhatsApp yang terdaftar.',sendFailed:'Kode belum dapat dikirim. Silakan coba lagi beberapa saat.',otpInvalid:'Masukkan kode verifikasi 6 digit dari email.',passwordInvalid:'Password harus minimal 8 karakter dan memuat huruf besar, huruf kecil, angka, serta simbol.',passwordMismatch:'Ulangi password baru harus sama.',otpFailed:'Kode tidak valid atau sudah kedaluwarsa. Minta kode baru dan coba lagi.',saveFailed:'Password belum tersimpan. Silakan coba lagi.',success:'Password berhasil diubah. Silakan masuk memakai password baru.'},en:{forgot:'Forgot password?',title:'Reset password',intro:'Enter the registered email address and WhatsApp number to receive a verification code.',otpIntro:'Enter the 6-digit code sent to your email, then create a new password.',email:'Email address',phone:'WhatsApp number',phonePlaceholder:'Example: +62 812 3456 7890',security:'For security, the email address and WhatsApp number must match your Pawrent account.',send:'Send email code',cancel:'Cancel',otp:'Email verification code',otpPlaceholder:'6-digit code',newPassword:'New password',newPasswordPlaceholder:'At least 8 characters',confirmPassword:'Confirm new password',confirmPasswordPlaceholder:'Repeat new password',passwordHelp:'Your password must contain uppercase, lowercase, a number, and a symbol.',save:'Save new password',close:'Close',connection:'Account connection is unavailable. Please reload the page.',accountMismatch:'The account details do not match. Check the registered email and WhatsApp number.',sendFailed:'The code could not be sent. Please try again shortly.',otpInvalid:'Enter the 6-digit verification code from your email.',passwordInvalid:'Password must be at least 8 characters and include uppercase, lowercase, a number, and a symbol.',passwordMismatch:'The confirmed password does not match.',otpFailed:'The code is invalid or expired. Request a new code and try again.',saveFailed:'The password was not saved. Please try again.',success:'Password updated successfully. Please sign in using your new password.'}};
    const recoveryCopy=()=>recoveryStrings[en?'en':'id'];
    const refreshRecoveryText=()=>{const x=recoveryCopy();forgot.textContent=x.forgot;if(!recoveryOverlay)return;const verifying=!recoveryOverlay.querySelector('#recoveryVerify').hidden;recoveryOverlay.querySelector('#recoveryTitle').textContent=x.title;recoveryOverlay.querySelector('#recoveryIntro').textContent=verifying?x.otpIntro:x.intro;recoveryOverlay.querySelector('.recovery-close').setAttribute('aria-label',x.close);recoveryOverlay.querySelector('label[for="recoveryEmail"]').textContent=x.email;recoveryOverlay.querySelector('label[for="recoveryPhone"]').textContent=x.phone;recoveryOverlay.querySelector('#recoveryPhone').placeholder=x.phonePlaceholder;recoveryOverlay.querySelector('.recovery-help').textContent=x.security;recoveryOverlay.querySelector('#recoveryRequest [type="submit"]').textContent=x.send;recoveryOverlay.querySelector('label[for="recoveryOtp"]').textContent=x.otp;recoveryOverlay.querySelector('#recoveryOtp').placeholder=x.otpPlaceholder;recoveryOverlay.querySelector('label[for="recoveryNewPassword"]').textContent=x.newPassword;recoveryOverlay.querySelector('#recoveryNewPassword').placeholder=x.newPasswordPlaceholder;recoveryOverlay.querySelector('label[for="recoveryConfirmPassword"]').textContent=x.confirmPassword;recoveryOverlay.querySelector('#recoveryConfirmPassword').placeholder=x.confirmPasswordPlaceholder;recoveryOverlay.querySelectorAll('.recovery-help')[1].textContent=x.passwordHelp;recoveryOverlay.querySelector('#recoveryVerify [type="submit"]').textContent=x.save;recoveryOverlay.querySelectorAll('.recovery-cancel').forEach(button=>button.textContent=x.cancel)};
    const originalText=text;
    text=function(){ originalText(); forgot.hidden=signup; const english=en;const eyebrow=document.querySelector('.copy .eyebrow'),visual=document.querySelector('.visual'),eyeButton=document.querySelector('.eye');if(eyebrow)eyebrow.textContent=english?'PAWRENT-ONLY PORTAL':'PORTAL KHUSUS PAWRENT';if(visual)visual.setAttribute('aria-label',english?'EchaVet pet care':'Perawatan hewan EchaVet');if(eyeButton)eyeButton.setAttribute('aria-label',english?'Show password':'Tampilkan password');refreshRecoveryText(); };
    text();

    const overlay=document.createElement('div');
    overlay.className='recovery-overlay'; overlay.hidden=true;
    overlay.innerHTML=`<section class="recovery-box" role="dialog" aria-modal="true" aria-labelledby="recoveryTitle">
      <div class="recovery-head"><div><h2 id="recoveryTitle">Atur ulang password</h2><p id="recoveryIntro">Masukkan email dan nomor WhatsApp yang terdaftar untuk menerima kode verifikasi.</p></div><button class="recovery-close" type="button" aria-label="Tutup">×</button></div>
      <form id="recoveryRequest"><div class="field"><label for="recoveryEmail">Alamat email</label><input id="recoveryEmail" type="email" autocomplete="email" required placeholder="nama@email.com"></div><div class="field"><label for="recoveryPhone">Nomor WhatsApp</label><input id="recoveryPhone" type="tel" autocomplete="tel" required placeholder="Contoh: 0812 3456 7890"></div><p class="recovery-help">Untuk keamanan, email dan nomor WhatsApp harus sesuai dengan akun Pawrent.</p><div class="recovery-error" id="recoveryRequestError" aria-live="polite"></div><div class="recovery-actions"><button class="recovery-primary" type="submit">Kirim kode email</button><button class="recovery-secondary recovery-cancel" type="button">Batal</button></div></form>
      <form id="recoveryVerify" hidden><div class="field"><label for="recoveryOtp">Kode verifikasi dari email</label><input id="recoveryOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="6 digit kode"></div><div class="field"><label for="recoveryNewPassword">Password baru</label><input id="recoveryNewPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimal 8 karakter"></div><div class="field"><label for="recoveryConfirmPassword">Ulangi password baru</label><input id="recoveryConfirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Ulangi password baru"></div><p class="recovery-help">Password harus berisi huruf besar, huruf kecil, angka, dan simbol.</p><div class="recovery-error" id="recoveryVerifyError" aria-live="polite"></div><div class="recovery-actions"><button class="recovery-primary" type="submit">Simpan password baru</button><button class="recovery-secondary recovery-cancel" type="button">Batal</button></div></form>
    </section>`;
    document.body.append(overlay); recoveryOverlay=overlay; refreshRecoveryText();
    const requestForm=overlay.querySelector('#recoveryRequest'), verifyForm=overlay.querySelector('#recoveryVerify');
    const requestError=overlay.querySelector('#recoveryRequestError'), verifyError=overlay.querySelector('#recoveryVerifyError');
    let recoveryEmail='';
    const closeRecovery=()=>{ overlay.hidden=true; requestForm.reset(); verifyForm.reset(); requestForm.hidden=false; verifyForm.hidden=true; requestError.textContent=''; verifyError.textContent=''; recoveryEmail=''; };
    forgot.addEventListener('click',()=>{ overlay.hidden=false; overlay.querySelector('#recoveryEmail').focus(); });
    overlay.querySelector('.recovery-close').addEventListener('click',closeRecovery);
    overlay.querySelectorAll('.recovery-cancel').forEach(button=>button.addEventListener('click',closeRecovery));
    overlay.addEventListener('click',event=>{ if(event.target===overlay) closeRecovery(); });
    requestForm.addEventListener('submit',async event=>{
      event.preventDefault(); requestError.textContent='';
      if(!window.echavetDb){ requestError.textContent=recoveryCopy().connection; return; }
      const submit=requestForm.querySelector('[type=submit]');
      recoveryEmail=overlay.querySelector('#recoveryEmail').value.trim().toLowerCase();
      const recoveryPhone=overlay.querySelector('#recoveryPhone').value.trim();
      submit.disabled=true;
      const verified=await echavetDb.rpc('verify_pawrent_recovery_phone',{recovery_email:recoveryEmail,recovery_phone:recoveryPhone});
      if(verified.error || verified.data!==true){ submit.disabled=false; requestError.textContent=recoveryCopy().accountMismatch; return; }
      const sent=await echavetDb.auth.signInWithOtp({email:recoveryEmail,options:{shouldCreateUser:false}});
      submit.disabled=false;
      if(sent.error){ requestError.textContent=recoveryCopy().sendFailed; return; }
      requestForm.hidden=true; verifyForm.hidden=false; refreshRecoveryText(); overlay.querySelector('#recoveryOtp').focus();
    });
    verifyForm.addEventListener('submit',async event=>{
      event.preventDefault(); verifyError.textContent='';
      const otp=overlay.querySelector('#recoveryOtp').value.trim();
      const newPassword=overlay.querySelector('#recoveryNewPassword').value;
      const confirmation=overlay.querySelector('#recoveryConfirmPassword').value;
      if(!/^\d{6}$/.test(otp)){ verifyError.textContent=recoveryCopy().otpInvalid; return; }
      if(!valid(newPassword)){ verifyError.textContent=recoveryCopy().passwordInvalid; return; }
      if(newPassword!==confirmation){ verifyError.textContent=recoveryCopy().passwordMismatch; return; }
      const submit=verifyForm.querySelector('[type=submit]'); submit.disabled=true;
      const otpResult=await echavetDb.auth.verifyOtp({email:recoveryEmail,token:otp,type:'email'});
      if(otpResult.error){ submit.disabled=false; verifyError.textContent=recoveryCopy().otpFailed; return; }
      const update=await echavetDb.auth.updateUser({password:newPassword}); submit.disabled=false;
      if(update.error){ verifyError.textContent=recoveryCopy().saveFailed; return; }
      await echavetDb.auth.signOut();
      verifyError.className='recovery-error recovery-success'; verifyError.textContent=recoveryCopy().success;
      setTimeout(closeRecovery,2200);
    });
  })();
</script>
</body></html>
