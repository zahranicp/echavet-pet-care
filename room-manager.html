<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Kode Monitoring · Echavet</title><link rel="stylesheet" href="portal.css"><style>.page{max-width:960px;margin:auto;padding:38px 20px}.page h1{font:700 32px Georgia,serif;color:var(--brand)}.note{background:var(--accent);padding:12px;border-radius:10px;font-size:12px;color:var(--muted);margin-bottom:18px}</style></head><body><main class="page"><div class="logo"><img src="echavet-logo.png"><div>RSH Echavet<small>STAFF · ACCESS CODE MANAGEMENT</small></div></div><h1>Kelola kode monitoring</h1><p class="sub">Buat atau ubah kode empat angka yang diberikan kepada pawrent.</p><div class="note">Perubahan disimpan pada browser demo ini. Pada versi produksi, data tersimpan aman di server dan tersinkron ke portal pawrent.</div><section class="card"><table class="table"><thead><tr><th>Kode</th><th>Nama anabul</th><th>Ruang</th><th></th></tr></thead><tbody id="rows"></tbody></table><button class="primary" style="margin-top:16px" onclick="add()">+ Tambah kamar</button><button class="theme" style="margin-left:8px" onclick="location='clinic.html'">Kembali ke portal</button></section></main><script>const defaults={1234:{name:'Mochi',room:'Mawar 02',animal:'🐈'},1357:{name:'Bruno',room:'Kenanga 01',animal:'🐕'},'0987':{name:'Kiko',room:'Anggrek 04',animal:'🐇'},'0864':{name:'Luna',room:'Melati 03',animal:'🐈'}};let data=JSON.parse(localStorage.getItem('echavetRooms')||JSON.stringify(defaults));function draw(){rows.innerHTML=Object.entries(data).map(([c,p])=>'<tr><td><input value="'+c+'" maxlength="4" data-old="'+c+'"></td><td><input value="'+p.name+'"></td><td><input value="'+p.room+'"></td><td><button class="primary" onclick="save(this)">Simpan</button></td></tr>').join('')}function save(b){let x=b.closest('tr').querySelectorAll('input'),old=x[0].dataset.old,code=x[0].value.trim();if(!/^\\d{4}$/.test(code)){alert('Kode harus tepat 4 angka.');return}delete data[old];data[code]={name:x[1].value||'Anabul',room:x[2].value||'-',animal:'🐾'};localStorage.setItem('echavetRooms',JSON.stringify(data));draw()}function add(){let c=prompt('Kode 4 angka baru:');if(c&&/^\\d{4}$/.test(c)&&!data[c]){data[c]={name:'Anabul baru',room:'-',animal:'🐾'};localStorage.setItem('echavetRooms',JSON.stringify(data));draw()}}draw()</script></body></html>
