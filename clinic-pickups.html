<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengambilan Pasien · EchaVet</title><link rel="stylesheet" href="portal.css"><style>.page{max-width:960px;margin:auto;padding:36px 22px}.top{display:flex;align-items:center}.back{margin-left:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--brand);padding:9px 11px;font-size:12px;font-weight:700;cursor:pointer}.patient{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding:16px 0}.patient:first-child{border-top:0}.animal{font-size:30px}.patient div{flex:1}.patient b{display:block}.patient small{color:var(--muted);display:block;margin-top:4px;font-size:12px}.wa{background:#e6f5e8;color:#26733d;border:0;border-radius:9px;padding:10px 12px;text-decoration:none;font-size:12px;font-weight:700}.done{border:0;border-radius:9px;background:var(--brand);color:#fff;padding:10px 12px;font-size:12px;font-weight:700;cursor:pointer}.empty{color:var(--muted);padding:18px 0}@media(max-width:600px){.patient{align-items:flex-start;flex-wrap:wrap}.wa,.done{margin-left:44px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="echavet-supabase.js"></script></head><body><main class="page"><div class="top"><div class="logo"><img src="echavet-logo.png"><div>RSH Echavet<small>PENGAMBILAN PASIEN</small></div></div><button class="back" onclick="location='clinic-inpatients.html'">Kembali ke rawat inap</button></div><div class="heading"><h1>Pasien siap dijemput</h1><p>Hubungi Pawrent. CCTV tetap aktif hingga dua jam setelah pasien dinyatakan boleh pulang.</p></div><section class="card"><div id="list" class="empty">Memuat data pengambilan…</div></section></main><script>
const list=document.getElementById('list');function whatsapp(v){let n=(v||'').replace(/D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);return n?'https://wa.me/'+n:''}async function render(){let r=await echavetDb.from('inpatient_stays').select('*').eq('status','menunggu_pulang').order('discharged_at');if(r.error){list.textContent=r.error.message;return}if(!r.data.length){list.textContent='Belum ada pasien yang menunggu dijemput.';return}list.innerHTML=r.data.map(x=>'<article class="patient"><span class="animal">🐾</span><div><b>'+x.pet_name+'</b><small>'+x.owner_name+' · '+x.owner_phone+'<br>Ruang '+(x.room||'-')+' · CCTV aktif sampai '+new Date(x.cctv_until).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+'</small></div>'+(whatsapp(x.owner_phone)?'<a class="wa" target="_blank" rel="noopener" href="'+whatsapp(x.owner_phone)+'">WhatsApp Pawrent</a>':'')+'<button class="done" onclick="finish(\''+x.id+'\')">Sudah dijemput</button></article>').join('')}async function finish(id){if(!confirm('Tandai pasien sudah dijemput dan matikan CCTV kamar?'))return;let r=await echavetDb.from('inpatient_stays').update({status:'pulang',cctv_until:new Date().toISOString()}).eq('id',id);if(r.error){alert(r.error.message);return}render()}render();
</script><script>
  whatsapp=function(value){let number=(value||'').replace(/\D/g,'');if(number.startsWith('0'))number='62'+number.slice(1);return number?'https://wa.me/'+number:''};
</script></body></html>
