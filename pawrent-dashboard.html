<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pawrent Portal · Echavet</title><link rel="stylesheet" href="portal.css"><style>.detail{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.detail div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}.detail b{display:block;margin-top:4px}.chatbox{height:380px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto}.msg{max-width:74%;padding:10px 12px;background:var(--surface2);border-radius:12px;margin:8px 0;font-size:12px}.msg.me{margin-left:auto;background:#dcecf8}.msg small{display:block;font-size:9px;color:var(--muted);margin-top:4px}.compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}.compose input{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}.notice{padding:12px;background:var(--accent);color:var(--brand);border-radius:10px;font-size:12px;margin-bottom:9px}.camera{height:min(45vw,390px)}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="echavet-supabase.js"></script></head><body><header class="topbar"><div class="logo"><img src="echavet-logo.png"><div>RSH Echavet<small>PAWRENT PORTAL</small></div></div><div class="top-actions"><button class="lang" onclick="toggleLang()" id="langBtn"></button><button class="theme" onclick="document.body.classList.toggle('dark')">☾</button><button class="logout" id="logout" onclick="location='login.html'"></button></div></header><div class="layout"><aside class="side"><div class="who"><b id="account"></b><small id="side"></small></div><nav class="nav"><button class="active" onclick="home(this)">⌂ <span id="navHome"></span></button><button onclick="camera(this)">🎥 <span id="navMonitor"></span></button><button onclick="report(this)">🐾 <span id="navReport"></span></button><button onclick="chat(this)">💬 <span id="navChat"></span></button><button onclick="schedule(this)">📅 <span id="navSchedule"></span></button></nav></aside><main class="content" id="app"></main></div><script>let en=localStorage.getItem('echavetLang')==='en';const code=localStorage.getItem('echavetPetCode')||'1234',defaults={1234:{name:'Mochi',species:'Kucing',breed:'British Shorthair',age:'2 tahun',room:'Mawar 02',temp:'38.4',weight:'4.2',food:'Baik',water:'Mau minum',stool:'Padat / normal',vomit:'Tidak muntah',activity:'Aktif dan nyaman',treatment:'Observasi rutin',notes:'Mochi makan dan minum dengan baik. Pemeriksaan berikutnya pukul 16.00 WIB.',updated:'Hari ini, 12.00'},1357:{name:'Bruno',species:'Anjing',breed:'Golden Retriever',age:'4 tahun',room:'Kenanga 01',temp:'38.6',weight:'22.4',food:'Baik',water:'Mau minum',stool:'Padat / normal',vomit:'Tidak muntah',activity:'Tenang',treatment:'Observasi rutin',notes:'Bruno sedang beristirahat nyaman.',updated:'Hari ini, 12.00'},'0987':{name:'Kiko',species:'Kelinci',breed:'Holland Lop',age:'1 tahun',room:'Anggrek 04',temp:'38.4',weight:'1.8',food:'Baik',water:'Mau minum',stool:'Padat / normal',vomit:'Tidak muntah',activity:'Aktif dan nyaman',treatment:'Observasi rutin',notes:'Kiko aktif dan responsif.',updated:'Hari ini, 12.00'},'0864':{name:'Luna',species:'Kucing',breed:'Domestic Shorthair',age:'3 tahun',room:'Melati 03',temp:'38.2',weight:'3.9',food:'Baik',water:'Mau minum',stool:'Padat / normal',vomit:'Tidak muntah',activity:'Tenang',treatment:'Observasi rutin',notes:'Luna beristirahat dengan nyaman.',updated:'Hari ini, 12.00'}},shDefault=[{doctor:'dr. Echa',start:'07:00',end:'19:00'},{doctor:'dr. Chika',start:'19:00',end:'07:00'}],app=document.getElementById('app');const T={id:{lang:'English',logout:'Keluar',account:'Akun Pawrent',home:'Beranda',monitor:'Monitoring anabul',report:'Laporan kesehatan',chat:'Konsultasi dokter',schedule:'Jadwal dokter',latest:'Data terakhir staf',care:'Status perawatan',room:'Ruang',onDuty:'Dokter jaga',temperature:'Suhu',weight:'Berat',food:'Makan',quick:'Akses cepat',live:'Monitoring live',cctv:'CCTV ruang rawat',consult:'Konsultasi',shift:'Shift jaga',health:'Laporan kesehatan',staffData:'Data dari staf',monitorTitle:'Monitoring anabul',liveCamera:'CCTV live',cameraHint:'CCTV live akan tampil saat staf menyalakan CCTV ruang rawat.',latestUpdate:'Update terakhir',fullReport:'Lihat laporan lengkap',healthTitle:'Laporan kesehatan',entered:'Diinput staf',typeBreed:'Jenis / ras',ageRoom:'Usia / ruang',bodyTemp:'Suhu tubuh',bodyWeight:'Berat badan',appetite:'Nafsu makan',water:'Minum',stool:'Pup',vomit:'Muntah',activity:'Aktivitas',treatment:'Obat / tindakan',notes:'Catatan staf',consultTitle:'Konsultasi',you:'Anda',message:'Tulis pesan untuk',send:'Kirim',scheduleTitle:'Jadwal dokter',scheduleSub:'Shift yang diatur oleh staf.',doctor:'Dokter',start:'Mulai',end:'Selesai'},en:{lang:'Bahasa Indonesia',logout:'Sign out',account:'Pawrent account',home:'Home',monitor:'Pet monitoring',report:'Health report',chat:'Doctor consultation',schedule:'Doctor schedule',latest:'Latest staff update',care:'Care status',room:'Room',onDuty:'Doctor on duty',temperature:'Temperature',weight:'Weight',food:'Food',quick:'Quick access',live:'Live monitoring',cctv:'Ward CCTV',consult:'Consultation',shift:'Duty shift',health:'Health report',staffData:'Staff-entered data',monitorTitle:'Pet monitoring',liveCamera:'Live CCTV',cameraHint:'Live CCTV will appear once staff turns on the ward CCTV.',latestUpdate:'Latest update',fullReport:'View full report',healthTitle:'Health report',entered:'Recorded by staff',typeBreed:'Species / breed',ageRoom:'Age / room',bodyTemp:'Body temperature',bodyWeight:'Body weight',appetite:'Appetite',water:'Water intake',stool:'Stool',vomit:'Vomiting',activity:'Activity',treatment:'Medication / treatment',notes:'Staff notes',consultTitle:'Consultation',you:'You',message:'Write a message to',send:'Send',scheduleTitle:'Doctor schedule',scheduleSub:'Shifts managed by staff.',doctor:'Doctor',start:'Start',end:'End'}};function tr(){return T[en?'en':'id']}function d(){return JSON.parse(localStorage.getItem('echavetMonitoring')||'{}')[code]||defaults[code]}function shifts(){return JSON.parse(localStorage.getItem('echavetShifts')||JSON.stringify(shDefault))}function active(){let m=new Date().getHours()*60+new Date().getMinutes();return shifts().find(x=>{let a=x.start.split(':').map(Number),b=x.end.split(':').map(Number),s=a[0]*60+a[1],e=b[0]*60+b[1];return s<e?m>=s&&m<e:m>=s||m<e})||shifts()[0]}function nav(b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active')}function h(a,b){return '<div class="heading"><h1>'+a+'</h1><p>'+b+'</p></div>'}function ui(){let t=tr();document.documentElement.lang=en?'en':'id';langBtn.textContent=t.lang;logout.textContent=t.logout;account.textContent=t.account;navHome.textContent=t.home;navMonitor.textContent=t.monitor;navReport.textContent=t.report;navChat.textContent=t.chat;navSchedule.textContent=t.schedule}function home(b){nav(b);ui();let x=d(),doc=active(),t=tr();side.textContent=x.name+' · '+(en?'Code':'Kode')+' '+code;app.innerHTML=h(x.name,t.latest+' · '+x.updated)+'<div class="grid"><section class="card"><h2>'+t.care+'</h2><div class="pet"><div class="animal">🐾</div><div><b>'+x.species+' · '+x.breed+'</b><small>'+x.age+' · '+t.room+' '+x.room+' · '+t.onDuty+' '+doc.doctor+'</small><span class="tag">'+x.activity+'</span></div></div><div class="stats"><div class="stat"><small>'+t.temperature+'</small><b>'+x.temp+' C</b></div><div class="stat"><small>'+t.weight+'</small><b>'+x.weight+' kg</b></div><div class="stat"><small>'+t.food+'</small><b>'+x.food+'</b></div></div></section><aside class="card"><h2>'+t.quick+'</h2><div class="quick"><button onclick="camera()"><span>🎥</span><b>'+t.live+'</b><small>'+t.cctv+'</small></button><button onclick="chat()"><span>💬</span><b>'+t.consult+'</b><small>'+doc.doctor+'</small></button><button onclick="schedule()"><span>📅</span><b>'+t.schedule+'</b><small>'+t.shift+'</small></button><button onclick="report()"><span>🐾</span><b>'+t.health+'</b><small>'+t.staffData+'</small></button></div></aside></div>'}function camera(b){nav(b);ui();let x=d(),t=tr();app.innerHTML=h(t.monitorTitle+': '+x.name,t.cctv+' '+x.room)+'<div class="grid"><section class="card"><h2>'+t.liveCamera+'</h2><div class="camera"><div class="cam-copy"><span>🎥</span><p>'+t.cameraHint+'</p></div></div></section><aside class="card"><h2>'+t.latestUpdate+'</h2><p class="sub">'+x.notes+'</p><button class="primary" onclick="report()">'+t.fullReport+'</button></aside></div>'}function report(b){nav(b);ui();let x=d(),t=tr();app.innerHTML=h(t.healthTitle+' '+x.name,t.entered+' · '+x.updated)+'<section class="card"><div class="detail"><div>'+t.typeBreed+'<b>'+x.species+' · '+x.breed+'</b></div><div>'+t.ageRoom+'<b>'+x.age+' · '+x.room+'</b></div><div>'+t.bodyTemp+'<b>'+x.temp+' C</b></div><div>'+t.bodyWeight+'<b>'+x.weight+' kg</b></div><div>'+t.appetite+'<b>'+x.food+'</b></div><div>'+t.water+'<b>'+x.water+'</b></div><div>'+t.stool+'<b>'+x.stool+'</b></div><div>'+t.vomit+'<b>'+x.vomit+'</b></div><div>'+t.activity+'<b>'+x.activity+'</b></div><div>'+t.treatment+'<b>'+x.treatment+'</b></div></div><div class="notice" style="margin-top:14px"><b>'+t.notes+'</b><br>'+x.notes+'</div></section>'}function messages(){return JSON.parse(localStorage.getItem('echavetChats')||'{}')[code]||[]}function save(m){let a=JSON.parse(localStorage.getItem('echavetChats')||'{}');a[code]=m;localStorage.setItem('echavetChats',JSON.stringify(a))}function chat(b){nav(b);ui();let x=d(),doc=active(),m=messages(),t=tr();app.innerHTML=h(t.consultTitle+' '+x.name,(en?'Code':'Kode')+' '+code+' · '+t.onDuty+' '+doc.doctor)+'<div class="grid"><section class="card"><div class="chatbox"><div class="messages">'+m.map(q=>'<div class="msg '+(q.from==='pawrent'?'me':'')+'">'+q.text+'<small>'+(q.from==='pawrent'?t.you:q.doctor)+' · '+q.time+'</small></div>').join('')+'</div><form class="compose" onsubmit="send(event)"><input id="message" placeholder="'+t.message+' '+doc.doctor+'…"><button class="primary">'+t.send+'</button></form></div></section><aside class="card"><h2>'+doc.doctor+'</h2><p class="sub">'+t.shift+' '+doc.start+' - '+doc.end+' WIB</p></aside></div>'}function send(e){e.preventDefault();if(!message.value.trim())return;let m=messages(),doc=active();m.push({from:'pawrent',doctor:doc.doctor,text:message.value.replace(/</g,'&lt;'),time:new Date().toLocaleTimeString(en?'en-GB':'id-ID',{hour:'2-digit',minute:'2-digit'})});save(m);chat()}function schedule(b){nav(b);ui();let t=tr();app.innerHTML=h(t.scheduleTitle,t.scheduleSub)+'<section class="card"><table class="table"><tr><th>'+t.doctor+'</th><th>'+t.start+'</th><th>'+t.end+'</th></tr>'+shifts().map(x=>'<tr><td>'+x.doctor+'</td><td>'+x.start+'</td><td>'+x.end+'</td></tr>').join('')+'</table></section>'}function toggleLang(){en=!en;localStorage.setItem('echavetLang',en?'en':'id');home()}window.addEventListener('storage',()=>home());home();</script></body></html>
