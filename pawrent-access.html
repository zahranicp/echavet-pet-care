<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kode Monitoring · EchaVet</title><link rel="stylesheet" href="portal.css"><style>.page{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(470px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:33px;box-shadow:var(--shadow)}.box h1{font:700 29px Georgia,serif;color:var(--brand);margin:24px 0 7px}.box p{font-size:12px;color:var(--muted);line-height:1.6}.code{box-sizing:border-box;width:100%;font-size:25px;letter-spacing:11px;text-align:center;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin:15px 0 5px}.error{min-height:16px;font-size:11px;color:#b74d4d}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="page"><section class="box"><div class="logo"><img src="echavet-logo.png"><div>RSH Echavet<small>PAWRENT PORTAL</small></div></div><h1>Masukkan kode monitoring</h1><p>Gunakan kode empat angka dari staf untuk melihat CCTV kamar dan perkembangan rawat inap anabul Anda.</p><form id="form"><input id="code" class="code" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required placeholder="••••"><div id="error" class="error"></div><button class="primary" style="width:100%;margin-top:8px">Buka monitoring</button></form></section></main><script>
const defaults={1234:{name:'Mochi',room:'Mawar 02'},1357:{name:'Bruno',room:'Kenanga 01'},'0987':{name:'Kiko',room:'Anggrek 04'},'0864':{name:'Luna',room:'Melati 03'}};form.addEventListener('submit',async e=>{e.preventDefault();const v=code.value;let pet=JSON.parse(localStorage.getItem('echavetRooms')||JSON.stringify(defaults))[v];if(!pet){const cfg=window.PAWTALK_CONFIG,db=window.supabase?.createClient(cfg?.supabaseUrl,cfg?.supabasePublishableKey);if(db){const r=await db.from('inpatient_stays').select('pet_name,room').eq('monitoring_code',v).eq('status','dirawat').maybeSingle();if(r.data)pet={name:r.data.pet_name,room:r.data.room||'Ruang rawat'}}}if(!pet){error.textContent='Kode monitoring tidak valid. Hubungi staf.';return}localStorage.setItem('echavetPet',JSON.stringify(pet));localStorage.setItem('echavetPetCode',v);location='pawrent-dashboard.html'});
</script></body></html>
