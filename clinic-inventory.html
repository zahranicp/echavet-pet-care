<!doctype html>
<script>
  window.addEventListener('load',()=>{
    window.addItem=async function(){
      const item_name=document.getElementById('newName').value.trim(),brand=document.getElementById('newBrand').value.trim(),stock_quantity=Number(document.getElementById('newQty').value),unit=document.getElementById('newUnit').value.trim(),reorder_level=Number(document.getElementById('newReorder').value);
      if(!item_name||!unit||stock_quantity<0||reorder_level<0){say('Lengkapi data item dengan benar.');return}
      const r=await echavetDb.from('clinic_inventory').insert({item_name,category:document.getElementById('newCategory').value,brand,stock_quantity,unit,reorder_level}).select().single();
      if(r.error){say(r.error.message);return}
      items.push(r.data);document.getElementById('form').classList.remove('show');['newName','newBrand'].forEach(id=>document.getElementById(id).value='');render();say('Item stok ditambahkan.');
    };
  });
</script>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stok Layanan — RSH EchaVet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#24382b;--muted:#64766a;--cream:#f7f8f4;--paper:#fff;--leaf:#367052;--leaf-dark:#285b41;--coral:#e97955;--pale:#dfeee1;--line:#e0e8df;--red:#bd4f48}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--ink)}.top{height:76px;padding:0 clamp(20px,4vw,60px);display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700}.brand img{width:48px;height:48px;object-fit:contain}.brand small{display:block;color:var(--coral);font-size:8px;letter-spacing:1.4px;margin-top:2px}.back{margin-left:auto;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--leaf);padding:9px 11px;text-decoration:none;font-size:12px;font-weight:700}.page{max-width:1160px;margin:auto;padding:35px clamp(20px,4vw,60px) 65px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}.heading h1{font-size:clamp(27px,3vw,39px);letter-spacing:-1.5px;margin:0}.heading p{color:var(--muted);font-size:13px;margin:8px 0 0}.add{border:0;border-radius:10px;background:var(--leaf);color:#fff;padding:11px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}.form,.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px}.form{display:none;margin-bottom:20px}.form.show{display:block}.form h2,.card h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink);font:inherit;font-size:12px}.save{border:0;border-radius:8px;background:var(--leaf);color:#fff;padding:10px 13px;font-size:12px;font-weight:700;cursor:pointer;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.stat small{color:var(--muted);font-size:11px;display:block}.stat b{font-size:27px;display:block;margin-top:6px}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.item-top{display:flex;justify-content:space-between;gap:8px}.item b{font-size:15px}.badge{font-size:10px;padding:5px 7px;border-radius:20px;background:var(--pale);color:var(--leaf-dark)}.badge.low{background:#fff0ea;color:#ad5133}.item p{font-size:11px;color:var(--muted);line-height:1.5;margin:8px 0}.item input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit;font-size:11px;margin-top:5px}.item label{display:block;font-size:10px;color:var(--muted);margin-top:8px}.item button{border:0;border-radius:8px;background:#f0f5ef;color:var(--leaf);padding:8px 10px;font-size:11px;font-weight:700;cursor:pointer;margin-top:10px}.empty,.guard{color:var(--muted);font-size:13px;padding:20px 0}.guard{color:var(--red)}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:11px 14px;border-radius:9px;font-size:12px;transform:translateY(90px);transition:.25s}.toast.show{transform:none}@media(max-width:850px){.items,.grid,.stats{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.page{padding:26px 17px}.top{padding:0 17px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="echavet-supabase.js"></script></head><body><header class="top"><div class="brand"><img src="echavet-logo.png" alt="Logo EchaVet"><span>RSH EchaVet<small>STOK LAYANAN</small></span></div><a class="back" href="clinic-dashboard.html">Kembali ke dashboard</a></header><main class="page"><div class="heading"><div><h1>Stok layanan & obat</h1><p>Kelola persediaan vaksin, obat, alat medis, dan kebutuhan grooming EchaVet.</p></div><button class="add" onclick="toggleForm()">+ Tambah item</button></div><section class="form" id="form"><h2>Item stok baru</h2><div class="grid"><div class="field"><label>Nama item</label><input id="newName" placeholder="Contoh: Amoxicillin 250 mg"></div><div class="field"><label>Kategori</label><select id="newCategory"><option>Vaksin</option><option>Obat</option><option>Alat Medis</option><option>Grooming</option><option>Lainnya</option></select></div><div class="field"><label>Merek</label><input id="newBrand" placeholder="Contoh: Perlu diisi"></div><div class="field"><label>Jumlah stok</label><input id="newQty" type="number" min="0" value="0"></div><div class="field"><label>Satuan</label><input id="newUnit" value="unit" placeholder="dosis / tablet / botol"></div><div class="field"><label>Batas restock</label><input id="newReorder" type="number" min="0" value="0"></div></div><button class="save" onclick="addItem()">Simpan item</button></section><div class="stats"><div class="stat"><small>Total jenis item</small><b id="total">—</b></div><div class="stat"><small>Item stok rendah</small><b id="low">—</b></div><div class="stat"><small>Total dosis / unit</small><b id="qty">—</b></div></div><section id="items" class="items"><div class="empty">Memuat inventaris…</div></section></main><div class="toast" id="toast"></div><script>
const $=id=>document.getElementById(id);let items=[];function say(t){let e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}function toggleForm(){$('form').classList.toggle('show')}function render(){let low=items.filter(x=>x.stock_quantity<=x.reorder_level);$('total').textContent=items.length;$('low').textContent=low.length;$('qty').textContent=items.reduce((n,x)=>n+x.stock_quantity,0);$('items').innerHTML=items.map(x=>{let isLow=x.stock_quantity<=x.reorder_level;return `<article class="item"><div class="item-top"><b>${x.item_name}</b><span class="badge ${isLow?'low':''}">${x.category}</span></div><p>${x.brand||'Merek belum diisi'}<br><strong>${x.stock_quantity} ${x.unit}</strong>${isLow?' · Perlu restock':''}</p><label>Merek<input id="brand-${x.id}" value="${x.brand||''}"></label><label>Jumlah stok<input id="qty-${x.id}" type="number" min="0" value="${x.stock_quantity}"></label><label>Batas restock<input id="reorder-${x.id}" type="number" min="0" value="${x.reorder_level}"></label><button onclick="saveItem('${x.id}')">Simpan perubahan</button></article>`}).join('')}async function addItem(){let item_name=$('newName').value.trim(),brand=$('newBrand').value.trim(),stock_quantity=Number($('newQty').value),unit=$('newUnit').value.trim(),reorder_level=Number($('newReorder').value);if(!item_name||!unit||stock_quantity<0||reorder_level<0){say('Lengkapi data item dengan benar.');return}let r=await echavetDb.from('clinic_inventory').insert({item_name,category:$('newCategory').value,brand,stock_quantity,unit,reorder_level});if(r.error){say(r.error.message);return}items.push(r.data?.[0]||{item_name,category:$('newCategory').value,brand,stock_quantity,unit,reorder_level});$('form').classList.remove('show');['newName','newBrand'].forEach(id=>$(id).value='');render();say('Item stok ditambahkan.')}async function saveItem(id){let item=items.find(x=>x.id===id),brand=$('brand-'+id).value.trim(),stock_quantity=Number($('qty-'+id).value),reorder_level=Number($('reorder-'+id).value);if(stock_quantity<0||reorder_level<0){say('Jumlah stok tidak valid.');return}let r=await echavetDb.from('clinic_inventory').update({brand,stock_quantity,reorder_level,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){say(r.error.message);return}Object.assign(item,{brand,stock_quantity,reorder_level});render();say('Stok diperbarui.')}async function start(){if(!window.echavetDb){$('items').innerHTML='<div class="guard">Koneksi Supabase belum tersedia.</div>';return}let auth=await echavetDb.auth.getUser();let profile=auth.data.user&&await echavetDb.from('profiles').select('role').eq('id',auth.data.user.id).maybeSingle();if(!profile?.data||!['staff','doctor'].includes(profile.data.role)){$('items').innerHTML='<div class="guard">Halaman ini khusus akun staf dan dokter.</div>';return}let r=await echavetDb.from('clinic_inventory').select('*').order('category').order('item_name');if(r.error){$('items').innerHTML='<div class="guard">'+r.error.message+'</div>'}else{items=r.data;render()}}start();
</script></body></html>
