<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kunjungan Langsung · RSH EchaVet</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#24382b;--muted:#64766a;--cream:#f8f7f2;--leaf:#367354;--line:#dbe7dc;--red:#bd4f48}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--ink)}.top{height:76px;padding:0 clamp(20px,4vw,60px);display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700}.brand img{width:48px;height:48px;object-fit:contain}.brand small{display:block;color:#e97955;font-size:8px;letter-spacing:1.4px;margin-top:2px}.back{margin-left:auto;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--leaf);padding:9px 11px;text-decoration:none;font-size:12px;font-weight:700}.page{max-width:940px;margin:auto;padding:35px clamp(20px,4vw,60px) 65px}.heading h1{font-size:clamp(27px,3vw,39px);letter-spacing:-1.5px;margin:0}.heading p,.sub{color:var(--muted);font-size:13px;line-height:1.5}.heading p{margin:8px 0 25px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{font-size:12px;font-weight:700}.field input,.field select{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;color:var(--ink)}.wide{grid-column:1/-1}.purpose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:7px}.purpose label{border:1px solid var(--line);border-radius:9px;padding:11px;display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}.purpose label:has(input:checked){background:#edf7ee;border-color:var(--leaf)}button{border:0;border-radius:9px;background:var(--leaf);color:#fff;padding:11px 15px;font-weight:700;cursor:pointer}.guard{color:var(--red);font-size:13px}@media(max-width:620px){.form,.purpose{grid-template-columns:1fr}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="echavet-supabase.js"></script></head><body><header class="top"><div class="brand"><img src="echavet-logo.png"><span>RSH EchaVet<small>KUNJUNGAN LANGSUNG</small></span></div><a class="back" href="clinic-dashboard.html">Kembali ke dashboard</a></header><main class="page"><div class="heading"><h1>Pendaftaran kunjungan langsung</h1><p>Untuk Pawrent yang datang tanpa booking online. Data ini dapat dipilih saat pasien perlu menjalani rawat inap.</p></div><section class="card"><form id="form"><div class="form"><label class="field">Nama anabul<input id="petName" required placeholder="Contoh: Mochi"></label><label class="field">Jenis hewan<select id="species" required><option value="">Pilih jenis hewan</option><option>Kucing</option><option>Anjing</option><option>Kelinci</option><option>Hamster</option><option>Landak</option><option>Ikan</option></select></label><label class="field">Nama pemilik<input id="ownerName" required placeholder="Nama Pawrent"></label><label class="field">Nomor WhatsApp pemilik<input id="ownerPhone" required inputmode="tel" placeholder="08xxxxxxxxxx"></label><label class="field">Tanggal kunjungan<input id="visitDate" type="date" required></label><label class="field">Jam kunjungan<input id="visitTime" type="time" required></label><div class="field wide">Tujuan kedatangan<div id="purposes" class="purpose"><label><input type="checkbox" value="Check Up Rutin"> Check Up Rutin</label><label><input type="checkbox" value="Konsultasi Kesehatan Hewan"> Konsultasi kesehatan</label><label><input type="checkbox" value="Vaksinasi"> Vaksinasi</label><label><input type="checkbox" value="USG"> USG</label><label><input type="checkbox" value="Sterilisasi"> Sterilisasi</label><label><input type="checkbox" value="Pemeriksaan Darah/Hematology"> Pemeriksaan darah</label><label><input type="checkbox" value="Tindakan Operasi"> Tindakan operasi</label><label><input type="checkbox" value="Grooming"> Grooming</label><label><input type="checkbox" value="Lainnya"> Lainnya</label></div></div><div class="wide"><button>Daftarkan kunjungan</button></div></div></form><p id="message" class="sub"></p></section></main><script>
const f=document.getElementById('form'),msg=document.getElementById('message');visitDate.value=new Date().toISOString().slice(0,10);visitTime.value=new Date().toTimeString().slice(0,5);f.addEventListener('submit',async e=>{e.preventDefault();let p=[...document.querySelectorAll('#purposes input:checked')].map(x=>x.value);if(!p.length){msg.textContent='Pilih minimal satu tujuan kedatangan.';return}let auth=await echavetDb.auth.getUser();let profile=await echavetDb.from('profiles').select('role').eq('id',auth.data.user?.id).maybeSingle();if(!profile.data||!['staff','doctor'].includes(profile.data.role)){msg.className='guard';msg.textContent='Halaman ini khusus staf dan dokter.';return}let r=await echavetDb.from('walk_in_visits').insert({pet_name:petName.value.trim(),species:species.value,owner_name:ownerName.value.trim(),owner_phone:ownerPhone.value.trim(),visit_date:visitDate.value,visit_time:visitTime.value,purposes:p});if(r.error){msg.className='guard';msg.textContent=r.error.message;return}msg.className='sub';msg.textContent='Kunjungan langsung berhasil didaftarkan. Data siap dipilih di Pasien rawat inap.';f.reset();visitDate.value=new Date().toISOString().slice(0,10);visitTime.value=new Date().toTimeString().slice(0,5)});
</script></body></html>
