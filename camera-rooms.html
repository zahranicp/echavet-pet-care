<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCTV Rawat Inap · EchaVet</title><link rel="stylesheet" href="portal.css"><style>.page{max-width:1250px;margin:auto;padding:25px 24px}.top{display:flex;align-items:center;margin-bottom:22px}.top h1{font:700 34px Georgia,serif;color:var(--brand);margin:8px 0 0}.back{margin-left:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--brand);padding:9px 11px;font-size:12px;font-weight:700;cursor:pointer}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.room{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}.preview{height:190px;background:#1f262b;color:#fff;display:grid;place-items:center}.preview video{width:100%;height:100%;object-fit:cover;display:none}.preview video.on{display:block}.empty{text-align:center}.empty img{width:48px;filter:brightness(0) invert(1);opacity:.9}.copy{padding:15px}.copy h2{font:700 19px Georgia,serif;margin:0 0 4px}.copy p{font-size:12px;color:var(--muted);margin:0 0 12px}.off{background:var(--surface2);color:var(--brand);border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:12px;font-weight:700;cursor:pointer;margin-left:7px}.live{font-size:10px;color:#e25050;font-weight:700;margin-left:8px}.live:before{content:'● '}@media(max-width:700px){.rooms{grid-template-columns:1fr}.page{padding:18px 15px}.top h1{font-size:27px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="echavet-supabase.js"></script></head><body><main class="page"><div class="top"><div><div class="logo"><img src="echavet-logo.png"><div>RSH Echavet<small>STAFF · ROOM CCTV</small></div></div><h1>CCTV rawat inap</h1></div><button class="back" onclick="location='clinic-dashboard.html'">Kembali ke dashboard</button></div><p class="sub">Kamar dan identitas pasien mengikuti data pasien rawat inap aktif.</p><section class="rooms" id="rooms"></section></main><script>
const allRooms=['Mawar 02','Kenanga 01','Anggrek 04','Melati 03'];let stream,active=-1,patients=[];function render(){rooms.innerHTML=allRooms.map((room,i)=>{let p=patients.find(x=>x.room===room),details=p?p.pet_name+' · '+p.species+' · Kode '+p.monitoring_code:'Belum ada pasien rawat inap';return '<article class="room"><div class="preview"><video id="video'+i+'" autoplay muted playsinline></video><div class="empty" id="empty'+i+'"><img src="cctv-icon.png" alt="CCTV"><br><small>'+(p?'CCTV siap untuk '+p.pet_name:'Preview CCTV '+room)+'</small></div></div><div class="copy"><h2>'+room+'</h2><p>'+details+'</p>'+(p?'<button class="primary" onclick="start('+i+')">Nyalakan CCTV</button><button class="off" onclick="stop('+i+')">Matikan CCTV</button><span class="live" id="live'+i+'" hidden>LIVE</span>':'<span class="badge">Kamar kosong</span>')+'</div></article>'}).join('')}async function start(i){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});if(active>=0)stop(active);active=i;let v=document.getElementById('video'+i);v.srcObject=stream;v.classList.add('on');document.getElementById('empty'+i).style.display='none';document.getElementById('live'+i).hidden=false}catch(e){alert('CCTV tidak dapat diakses. Pastikan perangkat kamera tersambung dan izin browser diberikan.')}}function stop(i){if(active!==i)return;stream?.getTracks().forEach(t=>t.stop());stream=null;document.getElementById('video'+i).classList.remove('on');document.getElementById('empty'+i).style.display='block';document.getElementById('live'+i).hidden=true;active=-1}async function load(){let r=await echavetDb.from('inpatient_stays').select('pet_name,species,room,monitoring_code').eq('status','dirawat');if(r.error){rooms.innerHTML='<p class="sub">Data CCTV belum dapat dimuat.</p>';return}patients=r.data||[];render()}load();setInterval(load,10000);
</script></body></html>
