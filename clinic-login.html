<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Klinik · Echavet</title><link rel="stylesheet" href="portal.css"><style>.page{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(440px,100%);padding:32px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.box h1{font:700 29px Georgia,serif;color:var(--brand);margin:27px 0 7px}.field{margin:14px 0}.field label{font-size:11px;font-weight:700;display:block;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}.pass{position:relative}.pass input{padding-right:45px}.eye{position:absolute;right:7px;top:6px;border:0;background:transparent;padding:7px;cursor:pointer}.err{min-height:16px;font-size:11px;color:#b94d4d;margin:7px 0}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="echavet-supabase.js"></script></head><body><main class="page"><section class="box"><div class="logo"><img src="echavet-logo.png"><div>RSH Echavet<small>CLINICAL PORTAL</small></div></div><h1>Akses Portal Klinik</h1><p class="sub">Khusus staf dan dokter RSH Echavet.</p><form onsubmit="login(event)"><div class="field"><label>Email</label><input id="email" required type="email" autocomplete="email"></div><div class="field"><label>Password</label><div class="pass"><input id="password" required type="password" autocomplete="current-password"><button type="button" class="eye" onclick="toggle()" aria-label="Lihat password">◉</button></div></div><div id="error" class="err"></div><button class="primary" style="width:100%" id="submitBtn">Masuk aman</button></form></section></main><script>function toggle(){password.type=password.type==='password'?'text':'password'}async function login(e){e.preventDefault();if(!window.echavetDb){error.textContent='Koneksi Supabase belum tersedia. Jalankan lewat Live Server.';return}submitBtn.disabled=true;const result=await echavetDb.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value});submitBtn.disabled=false;if(result.error){error.textContent='Email atau password tidak dikenali.';return}const profile=await echavetDb.from('profiles').select('role,full_name').eq('id',result.data.user.id).maybeSingle();if(profile.error||!profile.data||!['staff','doctor'].includes(profile.data.role)){await echavetDb.auth.signOut();error.textContent='Akun ini belum memiliki peran staf atau dokter. Periksa tabel profiles di Supabase.';return}localStorage.setItem('echavetClinicRole',profile.data.role);localStorage.setItem('echavetClinicName',profile.data.full_name||'');location='clinic-dashboard.html'}</script></body></html>
